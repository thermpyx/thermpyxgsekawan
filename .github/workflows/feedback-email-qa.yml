name: Feedback email backend QA
on:
  push:
    branches: [codex/simulator-visual-refinement]
    paths: [functions/**, firebase.json, .github/workflows/feedback-email-qa.yml]
  pull_request:
    paths: [functions/**, firebase.json, .github/workflows/feedback-email-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm test --prefix functions
