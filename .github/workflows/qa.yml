name: THERMPYX interface QA

on:
  push:
    branches: [codex/simulator-visual-refinement]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser QA tools
        run: |
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/thermpyx-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/thermpyx-qa" --ignore-scripts --no-save --package-lock=false --no-audit --no-fund playwright@1.62.1
          "$RUNNER_TEMP/thermpyx-qa/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/thermpyx-qa/node_modules" >> "$GITHUB_ENV"
          CHROMIUM_PATH=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$RUNNER_TEMP/thermpyx-qa/node_modules/playwright")
          echo "CHROMIUM_PATH=$CHROMIUM_PATH" >> "$GITHUB_ENV"
      - name: Start static site
        run: |
          python3 -m http.server 8003 --bind 127.0.0.1 > "$RUNNER_TEMP/thermpyx-http.log" 2>&1 &
          python3 - <<'PY'
          from urllib.request import urlopen
          from time import sleep
          for attempt in range(30):
              try:
                  with urlopen('http://127.0.0.1:8003/app.html', timeout=2) as response:
                      assert response.status == 200
                  break
              except OSError:
                  if attempt == 29:
                      raise
                  sleep(0.2)
          PY
      - name: Test Firebase adapters, calculations and translations with isolated fixtures
        run: |
          node qa/test-firebase-client.cjs
          node qa/test-calculator-validation.cjs
          node qa/test-i18n.cjs
          node qa/test-rev08.cjs
      - name: Test circular theme transitions
        run: node qa/test-interface-theme.cjs
      - name: Test responsive navigation
        run: node qa/test-navigation-layout.cjs
      - name: Test About layout
        run: node qa/test-about-layout.cjs
      - name: Test Developer entrance and return visits
        run: node qa/test-developer-intro.cjs
      - name: Test Developer card and readable accents
        run: node qa/test-developer-card.cjs
      - name: Test onboarding and help dialogs
        run: node qa/test-onboarding.cjs
      - name: Test feedback dialog
        run: node qa/test-feedback-modal.cjs
      - name: Test rocket and meteor popup entrances
        run: node qa/test-popup-launch.cjs
      - name: Test guided learning path
        run: node qa/test-learning-path.cjs
      - name: Test learning assessment
        run: node qa/test-learning-assessment.cjs
      - name: Test learning interface
        run: node qa/test-learning-ui.cjs
      - name: Test theory content and deep links
        run: node qa/test-theory-material.cjs
      - name: Test Firebase account interface
        run: node qa/test-firebase-account.cjs
      - name: Test Firebase live quiz interface
        run: node qa/test-firebase-live.cjs
      - name: Test Firebase navigation
        run: node qa/test-firebase-navigation.cjs
      - name: Test quiz skills
        run: node qa/test-quiz-skills.cjs
      - name: Test private flashcards
        run: node qa/test-flashcards-firebase.cjs
      - name: Test answer review
        run: node qa/test-answer-review.cjs
      - name: Test simulator design and source integrity
        run: node qa/test-simulator-design.cjs
      - name: Test simulator atmosphere and process laboratory
        run: |
          node qa/test-simulator-atmosphere.cjs
          node qa/test-process-simulator.cjs
      - name: Test browser history
        run: node qa/test-history.cjs --browser
      - name: Test persistent music shell
        run: node qa/test-shell-music.cjs
