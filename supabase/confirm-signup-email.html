<!-- Paste into Supabase Authentication → Email Templates → Confirm signup.
     Set subject to: Kode verifikasi akun THERMPYX
     Sender branding requires a verified SMTP sender configured in Supabase. -->
<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;padding:32px 16px;background:#0b1420;color:#ecf6fb;font-family:Arial,sans-serif">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#132231;border:1px solid #2b4656;border-radius:16px">
      <tr><td style="padding:32px">
        <p style="margin:0 0 28px;font-size:24px;font-weight:bold;letter-spacing:3px">THERMPY<span style="color:#ff914d">X</span></p>
        <h1 style="font-size:23px;margin:0 0 16px">Konfirmasi akun Anda</h1>
        <p style="font-size:15px;line-height:1.7;color:#c3d5de">Masukkan kode berikut pada halaman verifikasi akun THERMPYX:</p>
        <p style="padding:20px;background:#0b1824;border:1px solid #43cdd1;border-radius:10px;color:#65e0e0;font-size:30px;letter-spacing:5px;font-weight:bold;text-align:center">{{ .Token }}</p>
        <p style="font-size:13px;line-height:1.7;color:#afc7d3">Jika Anda tidak meminta pendaftaran ini, abaikan email ini. Jangan berikan kode ini kepada orang lain.</p>
        <p style="font-size:12px;color:#8eaaba;margin-top:28px">THERMPYX · Belajar, hitung, jelajahi.</p>
      </td></tr>
    </table>
  </td></tr></table>
</body></html>
